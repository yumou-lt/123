version: '2.0'
displayName: '冷亭雨 Flutter iOS 打包'
stages:
  - iOS_Build

iOS_Build:
  stage: iOS_Build
  image: macos-latest
  services: []
  variables:
    FLUTTER_VERSION: '3.24.0'
    PUB_HOSTED_URL: 'https://pub.flutter-io.cn'
    FLUTTER_STORAGE_BASE_URL: 'https://storage.flutter-io.cn'
  script:
    - |
      # 设置国内镜像
      export PUB_HOSTED_URL=https://pub.flutter-io.cn
      export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
      
      # 安装 Flutter
      echo "=== 安装 Flutter $FLUTTER_VERSION ==="
      git clone -b $FLUTTER_VERSION --depth 1 https://github.com/flutter/flutter.git $HOME/flutter
      export PATH="$PATH:$HOME/flutter/bin"
      flutter --version
      
      # 拉依赖
      echo "=== flutter pub get ==="
      flutter pub get
      
      # iOS 依赖
      echo "=== pod install ==="
      cd ios
      pod install --repo-update || pod install
      cd ..
      
      # 构建 IPA（不签名，后面自己签）
      echo "=== flutter build ipa ==="
      flutter build ipa --no-codesign --export-method=ad-hoc
      
      # 检查产物
      echo "=== 构建产物 ==="
      ls -la build/ios/ipa/ || echo "检查 build/ios/" && find build/ios -name "*.ipa" -o -name "*.app"
      
      # 如果没找到 IPA，试试 alternative
      if [ ! -d "build/ios/ipa" ]; then
        mkdir -p build/ios/ipa
        cd ios
        xcodebuild archive -workspace Runner.xcworkspace -scheme Runner -configuration Release -archivePath ../build/ios/Runner.xcarchive CODE_SIGNING_ALLOWED=NO
        xcodebuild -exportArchive -archivePath ../build/ios/Runner.xcarchive -exportPath ../build/ios/ipa -exportOptionsPlist ExportOptions.plist CODE_SIGNING_ALLOWED=NO || echo "ExportOptions.plist 不存在，使用默认导出"
        cd ..
      fi
  artifacts:
    paths:
      - build/ios/ipa/*.ipa
    expire_in: 30 days
