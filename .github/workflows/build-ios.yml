name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: 安装 CocoaPods
        run: brew install cocoapods

      - name: Flutter 依赖
        run: flutter pub get

      - name: Pod 依赖
        run: |
          cd ios
          pod install
          cd ..

      - name: 关闭签名（pbxproj）
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' "$PBX"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = ""/g' "$PBX"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PBX"
          sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' "$PBX"
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' "$PBX"

      - name: Flutter 编译 Dart
        run: flutter build ios --release --no-codesign || true

      - name: xcodebuild 编译
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/xcode \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: 打包 IPA
        run: |
          APP="build/xcode/Build/Products/Release-iphoneos/Runner.app"
          echo "=== .app ==="
          du -sh "$APP"
          ls -la "$APP"
          echo ""
          rm -rf Payload ChatApp.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/Runner.app
          zip -r -9 ChatApp.ipa Payload
          rm -rf Payload
          echo "=== IPA ==="
          ls -la ChatApp.ipa
          du -sh ChatApp.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-iOS
          path: ChatApp.ipa
