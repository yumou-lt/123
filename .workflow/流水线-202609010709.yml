version: "1.0"
name: lengtingyu
displayName: "冷亭雨FlutteriOS"
triggers:
  push:
    branches:
      - main

build:
  image: macos-latest
  script:
    - echo "=== 安装 Flutter ==="
    - git clone -b 3.24.0 --depth 1 https://github.com/flutter/flutter.git $HOME/flutter
    - export PATH="$PATH:$HOME/flutter/bin"
    - export PUB_HOSTED_URL=https://pub.flutter-io.cn
    - export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
    - flutter --version
    - echo "=== 拉依赖 ==="
    - flutter pub get
    - echo "=== Pod ==="
    - cd ios && pod install --repo-update || pod install; cd ..
    - echo "=== 构建 IPA ==="
    - flutter build ipa --no-codesign
    - echo "=== 检查产物 ==="
    - ls -la build/ios/ipa/
  artifacts:
    paths:
      - build/ios/ipa/*.ipa
    expire_in: 30 days