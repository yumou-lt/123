# ============================================================
# Codemagic 云端 iOS 打包配置（chat_app / Flutter）
# ------------------------------------------------------------
# 说明：
#  1. 本文件必须放在 git 仓库根目录（本仓库即 flutter_app 目录），提交并推送到 Gitee。
#  2. 本机 Windows 无法打 iOS 包，Codemagic 会在云端 macOS 上编译并生成 .ipa。
#  3. 免费套餐：每月 500 分钟 macOS 构建时长。
#  4. 两个工作流：
#     - ios-ipa-unsigned：不签名 IPA，无需任何苹果证书即可先验证整条管线是否跑通。
#     - ios-ipa-signed  ：签名 IPA（可安装到真机 / 上传 TestFlight / 上架 App Store）。
#       签名需要先在 Codemagic 里配置 Apple 证书（见“云打包iOS说明.md”）。
#  5. 默认所有构建都手动触发（Codemagic 控制台 Start new build），避免每推一次代码就烧分钟数。
# ============================================================

workflows:
  # ---------- 工作流 1：未签名 IPA（先跑通管线，零苹果配置） ----------
  ios-ipa-unsigned:
    name: iOS 未签名 IPA
    instance_type: mac_mini_m2        # 免费套餐可用的 Apple Silicon 构建机
    max_build_duration: 120
    environment:
      flutter: 3.24.0                 # 与本机 Flutter 版本保持一致，避免依赖意外升级
      xcode: latest
      cocoapods: default
    scripts:
      - name: 拉取 Flutter 依赖
        script: |
          flutter pub get
      - name: 安装 iOS Pods 依赖
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: 构建未签名 IPA
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # ---------- 工作流 2：签名 IPA（真机安装 / TestFlight / 上架） ----------
  ios-ipa-signed:
    name: iOS 签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    # integrations: 启用 App Store Connect 集成（密钥在 Codemagic → Team integrations 里保存后，
    #               把下面的占位名改成你保存的 key 名称，例如 codemagic_appstore_key）
    integrations:
      app_store_connect: APP_STORE_CONNECT_KEY_NAME   # ← 改成你的 App Store Connect API Key 名称
    environment:
      # ios_signing: 签名方式（app_store 或 ad-hoc / development）
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.chatApp        # ← 改成你在 Apple 开发者后台注册的 Bundle ID
      flutter: 3.24.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: 配置 Xcode 签名（应用描述文件）
        script: |
          xcode-project use-profiles
      - name: 拉取 Flutter 依赖
        script: |
          flutter pub get
      - name: 安装 iOS Pods 依赖
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: 构建签名 IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=1 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # publishing: 可选 —— 构建完成后自动上传 TestFlight（内部测试）
    # 需先在 App Store Connect 创建"内部测试员"分组，并启用 integrations.app_store_connect
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true
    #     beta_groups:
    #       - Internal testers
