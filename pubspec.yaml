name: chat_app
description: 极简黑底白字IM聊天APP
publish_to: 'none'
version: 1.7.1+10701

# Flutter SDK 约束（3.19+ 稳定版）
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # ========== 网络 & 通信 ==========
  dio: ^5.4.0                       # HTTP 请求（含 FormData + DioMediaType）
  web_socket_channel: ^2.4.0        # WebSocket 长连接

  # ========== 本地存储 ==========
  shared_preferences: ^2.2.0         # 存 token / userId

  # ========== 功能工具 ==========
  image_picker: ^1.1.0               # 拍照/相册选头像
  intl: ^0.19.0                      # 日期格式化（HH:mm / MM-dd）

  # ========== 新增：图片/语音/动画 ==========
  record: ^6.0.0                     # 语音录制
  audioplayers: ^6.0.0               # 音频播放
  photo_view: ^0.15.0                # 全屏图片预览
  cached_network_image: ^3.4.0       # 图片缓存

  # ========== 新增：自动更新 ==========
  package_info_plus: ^8.0.0          # 读当前版本号
  path_provider: ^2.1.0              # 找临时目录存 APK
  open_filex: ^4.4.0                 # 调起系统安装器（Android + iOS 通用）
  permission_handler: ^11.3.1         # 动态申请安装权限
  file_picker: ^8.1.2                 # 选择文件（pdf/zip/docx 等）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# 应用图标配置
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../蕾姆.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/bg_reim.png
